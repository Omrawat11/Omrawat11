<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1a1b26" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="280" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 3D Isometric Calendar Grid Silhouette -->
  <g transform="translate(425, 140) scale(1.1, 0.65) rotate(45)">
    <!-- Floor Grid Base -->
    <rect x="-120" y="-120" width="240" height="240" fill="none" stroke="#24283b" stroke-width="2" opacity="0.6" />
    <!-- Dynamic Isometric Pillars -->
    <rect x="-100" y="-100" width="16" height="16" fill="#38bdf8" opacity="0.4" />
    <rect x="-80" y="-100" width="16" height="16" fill="#7aa2f7" opacity="0.6" />
    <rect x="-60" y="-100" width="16" height="16" fill="#818cf8" opacity="0.8" />
    <rect x="-40" y="-100" width="16" height="16" fill="#bb9af7" opacity="0.5" />
    <rect x="-20" y="-100" width="16" height="16" fill="#c084fc" opacity="0.9" />

    <rect x="-100" y="-75" width="16" height="16" fill="#7aa2f7" opacity="0.7" />
    <rect x="-80" y="-75" width="16" height="16" fill="#38bdf8" opacity="0.9" />
    <rect x="-60" y="-75" width="16" height="16" fill="#818cf8" opacity="0.85" />
    <rect x="-40" y="-75" width="16" height="16" fill="#a855f7" opacity="0.95" />
    <rect x="-20" y="-75" width="16" height="16" fill="#7aa2f7" opacity="0.6" />

    <rect x="-100" y="-50" width="16" height="16" fill="#818cf8" opacity="0.8" />
    <rect x="-80" y="-50" width="16" height="16" fill="#a855f7" opacity="0.9" />
    <rect x="-60" y="-50" width="16" height="16" fill="#38bdf8" opacity="0.7" />
    <rect x="-40" y="-50" width="16" height="16" fill="#7aa2f7" opacity="0.8" />
    <rect x="-20" y="-50" width="16" height="16" fill="#bb9af7" opacity="0.75" />

    <rect x="-100" y="-25" width="16" height="16" fill="#bb9af7" opacity="0.6" />
    <rect x="-80" y="-25" width="16" height="16" fill="#38bdf8" opacity="0.85" />
    <rect x="-60" y="-25" width="16" height="16" fill="#818cf8" opacity="0.9" />
    <rect x="-40" y="-25" width="16" height="16" fill="#a855f7" opacity="0.8" />
    <rect x="-20" y="-25" width="16" height="16" fill="#38bdf8" opacity="0.5" />

    <rect x="-100" y="0" width="16" height="16" fill="#7aa2f7" opacity="0.8" />
    <rect x="-80" y="0" width="16" height="16" fill="#818cf8" opacity="0.95" />
    <rect x="-60" y="0" width="16" height="16" fill="#38bdf8" opacity="0.75" />
    <rect x="-40" y="0" width="16" height="16" fill="#c084fc" opacity="0.9" />
    <rect x="-20" y="0" width="16" height="16" fill="#7aa2f7" opacity="0.7" />

    <rect x="-100" y="25" width="16" height="16" fill="#38bdf8" opacity="0.5" />
    <rect x="-80" y="25" width="16" height="16" fill="#a855f7" opacity="0.85" />
    <rect x="-60" y="25" width="16" height="16" fill="#7aa2f7" opacity="0.9" />
    <rect x="-40" y="25" width="16" height="16" fill="#818cf8" opacity="0.65" />
    <rect x="-20" y="25" width="16" height="16" fill="#bb9af7" opacity="0.8" />
  </g>

  <!-- Typography Overlay -->
  <text x="425" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="url(#gridGrad)" letter-spacing="1.5">
    3D CONTRIBUTION PROFILE GRAPH
  </text>
  <text x="425" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Auto-generated daily via GitHub Actions • yoshi389111/github-profile-3d-contrib
  </text>

  <!-- Pulse Status Indicator -->
  <circle cx="410" cy="225" r="5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="425" y="229" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#7aa2f7">
    Workflow active • Synced with @Omrawat11
  </text>
</svg>
